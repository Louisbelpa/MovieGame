<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GuessToday — Maquettes iOS</title>
<link rel="stylesheet" href="assets/ds.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0d0d11; }
  .ios-wrap { padding: 22px; display: flex; align-items: flex-start; justify-content: center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="assets/design-canvas.jsx"></script>
<script type="text/babel" src="assets/ios-frame.jsx"></script>
<script type="text/babel" src="assets/gt-primitives.jsx"></script>
<script type="text/babel" src="assets/gt-components.jsx"></script>
<script type="text/babel" src="assets/gt-share-combined.jsx"></script>
<script type="text/babel" src="assets/screens-ios-a.jsx"></script>
<script type="text/babel" src="assets/screens-ios-b.jsx"></script>
<script type="text/babel" src="assets/screens-ios-c.jsx"></script>

<script type="text/babel" data-presets="react">
const AW = 446, AH = 918; // artboard size (device 402×874 + margin for shadow)

function App() {
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const B = (id, label, child) => (
    <DCArtboard id={id} label={label} width={AW} height={AH}>
      <div className="ios-wrap">{child}</div>
    </DCArtboard>
  );
  return (
    <DesignCanvas>
      <DCSection id="onb" title="Onboarding" subtitle="3 slides — présentation des jeux GuessToday">
        {B('onb1', '1 · Un défi par jour', <IOSOnboarding slide={0} />)}
        {B('onb2', '2 · 5 essais, 3 indices', <IOSOnboarding slide={1} />)}
        {B('onb3', '3 · Joue avec tes amis', <IOSOnboarding slide={2} />)}
      </DCSection>

      <DCSection id="auth" title="Connexion / Inscription" subtitle="Compte, Apple & Google">
        {B('auth1', 'Inscription', <IOSAuth />)}
      </DCSection>

      <DCSection id="hub" title="Home / Hub" subtitle="Cards des défis, streak, mini-leaderboard">
        {B('hub1', 'Hub — défis du jour', <IOSHub />)}
      </DCSection>

      <DCSection id="game" title="Écrans de jeu" subtitle="Tactile, clavier natif, indices progressifs">
        {B('g1', 'FilmGuess · début + clavier', <IOSFilmStart />)}
        {B('g2', 'FilmGuess · 2 essais, 2 indices', <IOSFilmPlaying />)}
        {B('g3', 'FaceGuess · floue + bio', <IOSFace />)}
      </DCSection>

      <DCSection id="result" title="Résultat + partage natif" subtitle="Share Sheet iOS avec la carte « Ma journée » combinée">
        {B('r1', 'Résultat + Share Sheet', <IOSResult />)}
      </DCSection>

      <DCSection id="social" title="Stats · Profil · Classement · Amis" subtitle="Versions mobile-friendly">
        {B('s1', 'Stats du jour', <IOSStats />)}
        {B('s2', 'Profil', <IOSProfile />)}
        {B('s3', 'Classement amis', <IOSLeaderboard />)}
        {B('s4', 'Amis', <IOSFriends />)}
      </DCSection>
    </DesignCanvas>
  );
}

function mountWhenReady() {
  if (window.DesignCanvas && window.IOSDevice && window.IOSOnboarding && window.IOSFilmStart && window.IOSResult) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  } else {
    setTimeout(mountWhenReady, 30);
  }
}
mountWhenReady();
</script>
</body>
</html>
