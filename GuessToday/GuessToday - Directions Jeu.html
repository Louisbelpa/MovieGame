<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GuessToday — Directions « jeu »</title>
<link rel="stylesheet" href="assets/ds.css" />
<link rel="stylesheet" href="assets/directions.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0d0d11; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="assets/design-canvas.jsx"></script>
<script type="text/babel" src="assets/directions.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const { DesignCanvas, DCSection, DCArtboard } = window;
  return (
    <DesignCanvas>
      <DCSection id="arena" title="L'arène — partie en cours"
        subtitle="Même écran, 3 partis pris arcade. Compare l'énergie : tuiles, profondeur, couleur, typo.">
        <DCArtboard id="arena-a" label="A · NÉON — sombre, glow, glossy" width={760} height={1210}>
          <Arena k="a" />
        </DCArtboard>
        <DCArtboard id="arena-b" label="B · CANDY — clair, 3D, bonbon (Fredoka)" width={760} height={1210}>
          <Arena k="b" />
        </DCArtboard>
        <DCArtboard id="arena-c" label="C · BLOCS — Wordle × metrodoku (Archivo)" width={760} height={1210}>
          <Arena k="c" />
        </DCArtboard>
      </DCSection>

      <DCSection id="victory" title="La célébration — victoire"
        subtitle="Le moment de récompense : gros score, confettis, série +1, points. C'est là que le « jeu » se gagne.">
        <DCArtboard id="vic-a" label="A · NÉON" width={760} height={900}>
          <Victory k="a" />
        </DCArtboard>
        <DCArtboard id="vic-b" label="B · CANDY" width={760} height={900}>
          <Victory k="b" />
        </DCArtboard>
        <DCArtboard id="vic-c" label="C · BLOCS" width={760} height={900}>
          <Victory k="c" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

function mountWhenReady() {
  if (window.DesignCanvas && window.Arena && window.Victory) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  } else {
    setTimeout(mountWhenReady, 30);
  }
}
mountWhenReady();
</script>
</body>
</html>
